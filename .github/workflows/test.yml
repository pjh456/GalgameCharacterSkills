name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.2.13"

      - run: bun install

      - run: bun run lint

      - run: bun run test

      - run: bun run typecheck
